plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'fr.mediavee'
version = '2.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.yaml:snakeyaml:2.7'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.electronwill.night-config:toml:3.9.0'
    implementation 'com.typesafe:config:1.4.9'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

jar {
    enabled = false
}

shadowJar {
    archiveBaseName = 'configinjector'
    archiveClassifier = ''
    manifest {
        attributes(
            'Premain-Class': 'fr.mediavee.configinjector.ConfigInjector',
            'Main-Class': 'fr.mediavee.configinjector.ConfigInjector',
            'Implementation-Version': project.version
        )
    }
    // The agent jar joins the server's system class path, so bundled libraries
    // must not shadow the server's own SnakeYAML, Gson or night-config.
    def libs = 'fr.mediavee.configinjector.libs'
    relocate 'org.yaml.snakeyaml', "${libs}.snakeyaml"
    relocate 'com.google.gson', "${libs}.gson"
    relocate 'com.electronwill.nightconfig', "${libs}.nightconfig"
    relocate 'com.typesafe.config', "${libs}.typesafe.config"
    // Gson's error-prone annotations are compile-time only.
    exclude '**/module-info.class', 'META-INF/maven/**', 'META-INF/versions/**', 'META-INF/proguard/**', 'com/google/errorprone/**'
}

assemble {
    dependsOn shadowJar
}

test {
    useJUnitPlatform()
    dependsOn shadowJar
    def agentJar = shadowJar.archiveFile
    inputs.file(agentJar)
    jvmArgumentProviders.add({ ["-Dconfiginjector.jar=${agentJar.get().asFile}"] } as CommandLineArgumentProvider)
}
